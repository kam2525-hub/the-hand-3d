<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Hand - 3D Animation Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: radial-gradient(circle at center, #1e2530 0%, #0c0f14 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Header */
    .header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .badge {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }
    .title-box h1 {
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .title-box p {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Bottom Controller UI */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(18, 24, 36, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 6px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn span.icon {
      font-size: 20px;
    }
    .btn:active, .btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      transform: scale(0.96);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.5);
    }
    .btn-full {
      grid-column: span 3;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border: none;
      padding: 11px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }
    .btn-full:active {
      transform: scale(0.97);
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0c0f14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: 500; color: #94a3b8;">3Dモデル読み込み中...</div>
  </div>

  <div class="header">
    <div class="title-box">
      <h1>The Hand</h1>
      <p>Blender 3D Animation</p>
    </div>
    <div class="badge" id="anim-name">🎬 メドレー</div>
  </div>

  <div id="canvas-container"></div>

  <div class="controls">
    <div class="btn-grid">
      <button class="btn" onclick="playAction('Action_Fist', '✊ グー')">
        <span class="icon">✊</span>グー
      </button>
      <button class="btn" onclick="playAction('Action_Peace', '✌️ ピース')">
        <span class="icon">✌️</span>ピース
      </button>
      <button class="btn" onclick="playAction('Action_ThumbsUp', '👍 いいね')">
        <span class="icon">👍</span>いいね
      </button>
      <button class="btn" onclick="playAction('Action_Wave', '👋 バイバイ')">
        <span class="icon">👋</span>バイバイ
      </button>
      <button class="btn" onclick="playAction(null, '✋ パー')">
        <span class="icon">✋</span>パー (静止)
      </button>
      <button class="btn" onclick="resetView()">
        <span class="icon">🔄</span>視点リセット
      </button>
      <button class="btn btn-full" onclick="playAction('Hand_Showcase_Medley', '🎬 メドレー連続再生')">
        <span class="icon">▶️</span> 全アニメーション連続再生
      </button>
    </div>
    <div class="hint">👆 画面をなぞると360度回転 / ピンチで拡大縮小</div>
  </div>

    let scene, camera, renderer, controls, mixer, clock;
    let animations = {};
    let currentAction = null;
    let model;

    init();

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, -32, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(1.5, 0, -5);
      controls.update();

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xfff3e0, 2.0);
      dirLight1.position.set(-15, -25, 20);
      dirLight1.castShadow = true;
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xdbeafe, 1.2);
      dirLight2.position.set(20, -15, 10);
      scene.add(dirLight2);

      const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
      rimLight.position.set(0, 25, -10);
      scene.add(rimLight);

      // Load Model
      const binaryString = atob(glbBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const loader = new THREE.GLTFLoader();
      loader.parse(bytes.buffer, '', (gltf) => {
        model = gltf.scene;
        scene.add(model);

        // Warm skin material enhancement
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.roughness = 0.45;
              child.material.metalness = 0.05;
            }
          }
        });

        // Setup Animations
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          animations[clip.name] = mixer.clipAction(clip);
        });

        // Hide loading
        const loaderElem = document.getElementById('loading');
        loaderElem.style.opacity = '0';
        setTimeout(() => loaderElem.style.display = 'none', 400);

        // Auto play showcase medley
        playAction('Hand_Showcase_Medley', '🎬 メドレー');
      });

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function playAction(name, label) {
      document.getElementById('anim-name').innerText = label;
      
      if (!mixer) return;

      if (!name) {
        if (currentAction) currentAction.fadeOut(0.3);
        currentAction = null;
        return;
      }

      const newAction = animations[name];
      if (!newAction) return;

      if (currentAction === newAction) {
        newAction.reset();
        newAction.play();
        return;
      }

      if (currentAction) {
        currentAction.fadeOut(0.25);
      }

      newAction.reset();
      newAction.fadeIn(0.25);
      newAction.play();
      currentAction = newAction;
    }

    function resetView() {
      camera.position.set(0, -32, 2);
      controls.target.set(1.5, 0, -5);
      controls.update();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
